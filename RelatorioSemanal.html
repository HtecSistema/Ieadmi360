<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Semanal</title>

<link rel="stylesheet" href="RelatorioSemanal.css">
<style>
  body{
    display:flex !important;
    justify-content:flex-start !important;
    align-items:flex-start !important;
    background:#000 !important;
    margin:0 !important;
    padding:0 !important;
  }
  .folha{
    margin:0 !important;
    margin-right:auto !important;
    align-self:flex-start !important;
  }
  /* DEIXA OS 3 BOTÕES DO MESMO TAMANHO */
  .botoes{
    display:flex !important;
    gap:10px !important;
    flex-wrap:nowrap !important;
  }
  .botoes .btn{
    flex:1 !important;
    width:100% !important;
    height:44px !important;
    min-height:44px !important;
    padding:0 8px !important;
    font-size:12px !important;
    font-weight:800 !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    white-space:nowrap !important;
  }
</style>
</head><body>
<div class="folha">
  <div class="titulo topo">RELATÓRIO DE ENTRADA DE DÍZIMOS E OFERTAS DA SEMANAL</div>

  <div class="header-grid">
    <div><label>CONGREGAÇÃO</label><input id="congregacao" type="text"></div>
    <div><label>DIRIGENTE</label><input id="dirigente" type="text"></div>
    <div><label>TESOUREIRO</label><input id="tesoureiro" type="text"></div>
    <div><label>MÊS LANÇAMENTO</label><input id="mesLanc" type="text" readonly placeholder="Automático"></div>
    <div><label>DATA DO DIA</label><input id="dataDia" type="date"></div>
    <div><label>DIA DA SEMANA</label><input id="diaSemana" type="text" readonly placeholder="Automático"></div>
  </div>

  <div class="bloco">
    <div class="campo"><label>Valor dos Dízimos R$</label><input class="valor" id="dizimos" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="campo"><label>Oferta de Missões R$</label><input class="valor" id="ofertaMissoes" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="campo"><label>Oferta de Carnê Missionário R$</label><input class="valor" id="carne" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="campo"><label>Oferta do Culto R$</label><input class="valor" id="ofertaCulto" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="campo"><label>2º Oferta R$</label><input class="valor" id="oferta2" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="campo"><label>Oferta Construção R$</label><input class="valor" id="construcao" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="campo"><label>Outros R$</label><input class="valor" id="outros" type="text" inputmode="decimal" placeholder="0,00"></div>
    <div class="campo total"><label>Total de Entrada R$</label><input id="totalEntrada" type="text" readonly></div>
  </div>

  <div class="assinaturas">
    <div class="campo-ass"><label>Tesoureiro</label><input id="assTesoureiro" type="text"></div>
    <div class="campo-ass"><label>Dirigente</label><input id="assDirigente" type="text"></div>
  </div>

  <div class="botoes">
    <button id="btnSalvar" class="btn salvar">💾 SALVAR</button>
    <button id="btnLimpar" class="btn limpar">🧹 LIMPAR</button>
    <button id="btnEnviar" class="btn enviar">📤 ENVIAR / IMPRIMIR</button>
  </div>
</div>

<div id="print-area" style="display:none;"></div>
<script src="RelatorioSemanal.js"></script>
</body>
</html>
