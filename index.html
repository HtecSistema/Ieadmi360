<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ieadmi360 - Htec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#f8fafc;display:flex;min-height:100vh;overflow:hidden}
.sidebar{width:280px;background:#fff;border-right:1px solid #e2e8f0;padding:16px;display:flex;flex-direction:column;gap:16px;position:fixed;height:100vh;overflow:auto;z-index:100;transition:transform .3s ease}
.sidebar.hidden{transform:translateX(-100%)}
.top-logo{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}
.btn-fechar{background:#0f172a;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer}
.user-box{background:#f8f7ff;border:1px solid #ede9fe;padding:10px 12px;border-radius:14px}
.user-box small{font-size:9px;color:#64748b;font-weight:800;letter-spacing:.6px}
.user-box strong{font-size:12px;display:block;margin-top:2px}
.label{font-size:10px;color:#94a3b8;font-weight:800;letter-spacing:1px;padding-left:8px}
.menu{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;color:#334155;cursor:pointer}
.item.active{background:#0f172a;color:#fff}
.item.sair{margin-top:16px;background:#fff5f5;color:#dc2626;border:1px solid #fecaca}
.main{margin-left:280px;flex:1;display:flex;flex-direction:column;height:100vh;transition:margin .3s ease}
.main.full{margin-left:0}
.top-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center; gap:10px;}
.btn-menu{background:#0f172a;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}
.conteudo{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:#000}
.vazio{flex:1;display:grid;place-items:center;color:#94a3b8;text-align:center;padding:20px;background:#f8fafc;width:100%}
iframe{width:100%;height:100%;border:none;background:#000}
#formContainer{display:none;flex:1;flex-direction:column;width:100%;margin:0;align-self:stretch;align-items:flex-start;justify-content:flex-start}
@media(max-width:800px){
  .main{margin-left:0}
}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="top-logo"><span>💠 Ieadmi360</span><button class="btn-fechar" onclick="toggleMenu()">X FECHAR</button></div>
  <div class="user-box"><small>USUÁRIO LOGADO</small><strong>00425 - HELIO SOUZA SILVA</strong></div>
  <div class="label">PRINCIPAL</div>
  <div class="menu">
    <div class="item" onclick="abrirForm('xxal.html','📌 xxxxxx',this)">👑 Administrador</div>
    <div class="item" onclick="abrirForm('xxal.html','📌 xxxxxx',this)">📋 Cadastro</div>
    <div class="item" onclick="abrirForm('DTesouraria.html','📌 RELATÓRIO FINANCEIRO MENSAL DE DEPARTAMENTO',this)">💰 Tesouraria Departamento</div>
    <div class="item" onclick="abrirForm('RelatorioSemanal.html','📌 TESOURARIA SEMANAL',this)">💵 Tesouraria Semanal</div>
    <div class="item" onclick="abrirForm('CTesouraria.html','📌 Relatório Financeiro da Congregação',this)">💰 Relatorio Finaceiro</div>
    <div class="item" onclick="abrirForm('xxal.html','📌 xxxxxx',this)">📊 Relatorio Adm</div>
    <div class="item" onclick="abrirForm('xxal.html','📌 xxxxxx',this)">👤 Relatorio Usuario</div>
    <div class="item" onclick="abrirForm('xxal.html','📌 xxxxxx',this)">🛠️ Manutenção</div>
    <div class="item sair">🚪 Sair do Sistema</div>
  </div>
</div>
<div class="main" id="main">
  <div class="top-bar">
    <button class="btn-menu" id="btnMenu" onclick="toggleMenu()" style="display:none">☰ MENU</button>
    <div id="tituloSistema" style="font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">SISTEMA - Ieadmi360</div>
    <div style="font-size:11px;color:#64748b;font-weight:700">PARAGOMINAS</div>
  </div>
  <div class="conteudo">
    <div id="inicio" class="vazio"><div><div style="font-size:40px">📋</div><div style="font-weight:900;margin-top:8px;color:#0f172a">Ieadmi360</div></div></div>
    <div id="formContainer"></div>
  </div>
</div>
<script>
function toggleMenu(){
  const sb=document.getElementById('sidebar');const main=document.getElementById('main');const btn=document.getElementById('btnMenu');
  sb.classList.toggle('hidden');main.classList.toggle('full');btn.style.display=sb.classList.contains('hidden')?'block':'none';
}

// CACHE DE PROCESSOS - CADA UM FICA SEPARADO
const processos = {};

function abrirForm(url,titulo,el){
  document.querySelectorAll('.menu .item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('tituloSistema').innerText = titulo;
  document.getElementById('inicio').style.display='none';
  const container = document.getElementById('formContainer');
  container.style.display='flex';

  // Esconde todos os iframes já criados
  Object.values(processos).forEach(f => f.style.display='none');

  // Se já existe esse processo, só mostra ele - NÃO RECARREGA, NÃO APAGA
  if(processos[url]){
    processos[url].style.display='block';
  } else {
    // Primeira vez que clica, cria o iframe desse processo
    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.width='100%';
    iframe.style.height='100%';
    iframe.style.border='none';
    iframe.style.background='#000';
    container.appendChild(iframe);
    processos[url] = iframe;
  }

  if(window.innerWidth<=800){
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('main').classList.add('full');
    document.getElementById('btnMenu').style.display='block';
  }
}
if(window.innerWidth<=800){
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('main').classList.add('full');
  document.getElementById('btnMenu').style.display='block';
}
</script>
</body>
</html>
